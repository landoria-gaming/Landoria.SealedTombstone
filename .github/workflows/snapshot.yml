name: Snapshot build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapshot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    permissions:
      contents: write
    uses: landoria-gaming/LandoriaModActions/.github/workflows/snapshot.yml@v4.5
    with:
      project-file: Landoria.SealedTombstone.csproj
      mod-name: Landoria.SealedTombstone
      package-name: SealedTombstone
    secrets:
      references-token: ${{ secrets.MOD_REFERENCES_TOKEN }}
